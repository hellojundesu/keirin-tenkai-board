name: 選手コメント定期・手動取得

on:
  workflow_run:
    workflows: ["出走表を毎朝取得"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_date:
        description: コメント取得対象日（YYYY-MM-DD）
        required: true
        type: string
      operation:
        description: 実行内容
        required: true
        default: acquire
        type: choice
        options:
          - acquire
          - oidc-read

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: keirin-tospo-comments
  cancel-in-progress: false

jobs:
  oidc-read:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'oidc-read'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: コメント専用workflowのOIDC読み取り疎通
        env:
          CLOUD_INGEST_ENDPOINT: https://ypkmorovfnjyesfojcil.supabase.co/functions/v1/cloud-ingest
          CLOUD_INGEST_AUDIENCE: keirin-cloud-ingest-prod-v1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from automation.cloud.cloud_oidc_gateway_client import OIDCGatewayClient

          result = OIDCGatewayClient(
              os.environ["CLOUD_INGEST_ENDPOINT"],
              os.environ["CLOUD_INGEST_AUDIENCE"],
              retries=1,
          ).call({
              "operation": "read",
              "record_type": "cloud_comment_manifest",
              "record_key": "2099-12-31",
          })
          if not isinstance(result, dict) or "record" not in result:
              raise SystemExit("OIDC read response is invalid")
          print("comment workflow OIDC read-only connectivity: PASS")
          PY

  race-card-handoff:
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure') &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target_date: ${{ steps.handoff.outputs.target_date }}
      mode: ${{ steps.handoff.outputs.mode }}
    steps:
      - name: 出走表取得の完了情報を確認
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/race-card-handoff-artifacts.json"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/artifacts?name=race-card-acquisition-complete&per_page=1" \
            --output "$response"
          available="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); print("true" if any(not row.get("expired", False) for row in data.get("artifacts", [])) else "false")' "$response")"
          echo "available=$available" >> "$GITHUB_OUTPUT"
      - name: 出走表取得の完了情報を取得
        if: steps.artifact.outputs.available == 'true'
        uses: actions/download-artifact@v7
        with:
          name: race-card-acquisition-complete
          path: ${{ runner.temp }}/race-card-handoff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 対象日と取得モードを検証
        if: steps.artifact.outputs.available == 'true'
        id: handoff
        run: |
          set -euo pipefail
          target_date="$(tr -d '\r\n' < "$RUNNER_TEMP/race-card-handoff/target-date.txt")"
          mode="$(tr -d '\r\n' < "$RUNNER_TEMP/race-card-handoff/mode.txt")"
          python3 -c 'import datetime, sys; value=sys.argv[1]; assert datetime.date.fromisoformat(value).isoformat() == value' "$target_date"
          case "$mode" in
            full|lines-only) ;;
            *) echo "不明な取得モード: $mode" >&2; exit 1 ;;
          esac
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  acquire:
    needs: race-card-handoff
    if: >-
      always() && inputs.operation != 'oidc-read' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         needs.race-card-handoff.result == 'success' &&
         (needs.race-card-handoff.outputs.mode == 'full' ||
          needs.race-card-handoff.outputs.mode == 'lines-only'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: github-pages
    env:
      CLOUD_INGEST_ENDPOINT: https://ypkmorovfnjyesfojcil.supabase.co/functions/v1/cloud-ingest
      CLOUD_INGEST_AUDIENCE: keirin-cloud-ingest-prod-v1
      COMMENT_ROOT: ${{ github.workspace }}/.tospo-comments
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 対象日を固定
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET_DATE: ${{ inputs.target_date || '' }}
          HANDOFF_TARGET_DATE: ${{ needs.race-card-handoff.outputs.target_date }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            target_date="$HANDOFF_TARGET_DATE"
          else
            target_date="$MANUAL_TARGET_DATE"
          fi
          python3 -c 'import datetime, sys; value=sys.argv[1]; assert datetime.date.fromisoformat(value).isoformat() == value' "$target_date"
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "comment target date: $target_date"

      - name: 6時間以内の完全な東スポ世代を確認
        id: comment_complete
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          from automation.cloud.cloud_oidc_gateway_client import OIDCGatewayClient
          from automation.comments.cloud_comment_integration import verify_stored_tospo_generation

          target = os.environ["TARGET_DATE"]
          evidence_path = Path(os.environ["COMMENT_ROOT"]) / "precheck-verification.json"
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          client = OIDCGatewayClient(
              os.environ["CLOUD_INGEST_ENDPOINT"],
              os.environ["CLOUD_INGEST_AUDIENCE"],
              retries=1,
          )

          def read_record(record_type, record_key):
              response = client.call({
                  "operation": "read",
                  "record_type": record_type,
                  "record_key": record_key,
              })
              return (response or {}).get("record") or None

          complete = False
          try:
              result = verify_stored_tospo_generation(read_record, target)
              manifest = read_record("cloud_comment_manifest", target) or {}
              observed = datetime.fromisoformat(str(manifest.get("source_updated_at") or "").replace("Z", "+00:00"))
              age = datetime.now(timezone.utc) - observed.astimezone(timezone.utc)
              complete = os.environ["FORCE_REFRESH"] != "true" and timedelta(0) <= age < timedelta(hours=6)
              evidence = {"complete": complete, "age_seconds": int(age.total_seconds()), **result}
          except Exception as exc:
              evidence = {"complete": False, "race_date": target, "reason": f"{type(exc).__name__}: {exc}"}
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"complete={'true' if complete else 'false'}\n")
          print(json.dumps(evidence, ensure_ascii=True, sort_keys=True))
          PY

      - name: 保存済み出走表を確認
        if: steps.comment_complete.outputs.complete != 'true'
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          test -f "data/$TARGET_DATE/manifest.json"
          mkdir -p "$COMMENT_ROOT/cache"

      - name: コメント対象カタログを作成
        if: steps.comment_complete.outputs.complete != 'true'
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          python3 automation/comments/cloud_comment_catalog.py "data/$TARGET_DATE" \
            --output "$COMMENT_ROOT/catalog.json"

      - name: 同じ対象日の探索状態を復元
        if: steps.comment_complete.outputs.complete != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.COMMENT_ROOT }}/cache
            ${{ env.COMMENT_ROOT }}/discovery-state.json
          key: tospo-discovery-v2-${{ steps.target.outputs.target_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tospo-discovery-v2-${{ steps.target.outputs.target_date }}-

      - name: 東スポの出走表コメントを取得・照合
        id: comment_acquire
        if: steps.comment_complete.outputs.complete != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 automation/comments/tospo_comment_acquisition.py --live \
            --catalog "$COMMENT_ROOT/catalog.json" \
            --cache-root "$COMMENT_ROOT/cache" \
            --discovery-state "$COMMENT_ROOT/discovery-state.json" \
            --output "$COMMENT_ROOT/records.json" \
            --run-report "$COMMENT_ROOT/acquisition-report.json"

      - name: 限定CASでコメント世代を保存
        id: publish
        if: steps.comment_complete.outputs.complete != 'true' && steps.comment_acquire.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 automation/comments/cloud_comment_rpc_publish.py --live \
            --records "$COMMENT_ROOT/records.json" \
            --queue "$COMMENT_ROOT/queue.json" \
            --report "$COMMENT_ROOT/publish-report.json"

      - name: 保存済み東スポ世代を全件検証
        id: verify
        if: steps.comment_complete.outputs.complete != 'true' && steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from automation.cloud.cloud_oidc_gateway_client import OIDCGatewayClient
          from automation.comments.cloud_comment_integration import verify_stored_tospo_generation

          client = OIDCGatewayClient(os.environ["CLOUD_INGEST_ENDPOINT"], os.environ["CLOUD_INGEST_AUDIENCE"])
          target = os.environ["TARGET_DATE"]

          def read_record(record_type, record_key):
              response = client.call({"operation": "read", "record_type": record_type, "record_key": record_key})
              return (response or {}).get("record") or None

          summary = verify_stored_tospo_generation(read_record, target)
          root = Path(os.environ["COMMENT_ROOT"])
          (root / "verification.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=True, sort_keys=True))
          PY

      - name: 探索途中の状態を次回へ保存
        if: always() && steps.comment_complete.outputs.complete != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.COMMENT_ROOT }}/cache
            ${{ env.COMMENT_ROOT }}/discovery-state.json
          key: tospo-discovery-v2-${{ steps.target.outputs.target_date }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 検証証跡を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tospo-comment-acquisition-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/.tospo-comments/precheck-verification.json
            ${{ github.workspace }}/.tospo-comments/acquisition-report.json
            ${{ github.workspace }}/.tospo-comments/publish-report.json
            ${{ github.workspace }}/.tospo-comments/verification.json
          if-no-files-found: warn
          retention-days: 14

      - name: 取得・保存・検証エラーを反映
        if: >-
          always() && steps.comment_complete.outputs.complete != 'true' &&
          (steps.comment_acquire.outcome == 'failure' ||
           steps.publish.outcome == 'failure' ||
           steps.verify.outcome == 'failure')
        run: exit 1

