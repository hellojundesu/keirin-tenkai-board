name: 選手コメント定期・手動取得

on:
  schedule:
    # 21:30 JST: 当日の結果を再取得。04:00 JST: UTC上の前日を補完。
    - cron: '30 12 * * *'
    - cron: '0 19 * * *'
  workflow_run:
    workflows:
      - 出走表を毎朝取得
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_date:
        description: コメント取得対象日（YYYY-MM-DD）
        required: true
        type: string
      operation:
        description: 実行内容
        required: true
        default: oidc-read
        type: choice
        options:
          - oidc-read
          - acquire
          - acquire-confirmed

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: keirin-cloud-comment-one-day-trial
  cancel-in-progress: false

jobs:
  oidc-read:
    if: inputs.operation == 'oidc-read'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: コメント専用workflowのOIDC読み取り疎通
        env:
          CLOUD_INGEST_ENDPOINT: https://ypkmorovfnjyesfojcil.supabase.co/functions/v1/cloud-ingest
          CLOUD_INGEST_AUDIENCE: keirin-cloud-ingest-prod-v1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from automation.cloud.cloud_oidc_gateway_client import OIDCGatewayClient

          result = OIDCGatewayClient(
              os.environ["CLOUD_INGEST_ENDPOINT"],
              os.environ["CLOUD_INGEST_AUDIENCE"],
              retries=1,
          ).call({
              "operation": "read",
              "record_type": "cloud_comment_manifest",
              "record_key": "2099-12-31",
          })
          if not isinstance(result, dict) or "record" not in result:
              raise SystemExit("OIDC read response is invalid")
          print("comment workflow OIDC read-only connectivity: PASS")
          PY

  race-card-handoff:
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure') &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target_date: ${{ steps.handoff.outputs.target_date }}
      mode: ${{ steps.handoff.outputs.mode }}
    steps:
      - name: 出走表完了情報の有無を確認
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/race-card-handoff-artifacts.json"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/artifacts?name=race-card-acquisition-complete&per_page=1" \
            --output "$response"
          available="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); print("true" if any(not row.get("expired", False) for row in data.get("artifacts", [])) else "false")' "$response")"
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "race-card handoff artifact available: $available"
      - name: 出走表取得の完了情報を取得
        if: steps.artifact.outputs.available == 'true'
        uses: actions/download-artifact@v7
        with:
          name: race-card-acquisition-complete
          path: ${{ runner.temp }}/race-card-handoff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 対象日と取得モードを検証
        if: steps.artifact.outputs.available == 'true'
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          target_date="$(tr -d '\r\n' < "$RUNNER_TEMP/race-card-handoff/target-date.txt")"
          mode="$(tr -d '\r\n' < "$RUNNER_TEMP/race-card-handoff/mode.txt")"
          python3 -c 'import datetime, sys; value=sys.argv[1]; assert datetime.date.fromisoformat(value).isoformat() == value' "$target_date"
          case "$mode" in
            full|lines-only) ;;
            *) echo "不明な取得モード: $mode" >&2; exit 1 ;;
          esac
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "race-card handoff: target_date=$target_date mode=$mode"

  comment-trial:
    needs: race-card-handoff
    if: >-
      always() && (
        github.event_name == 'schedule' ||
        inputs.operation == 'acquire' ||
        inputs.operation == 'acquire-confirmed' ||
        (github.event_name == 'workflow_run' &&
         needs.race-card-handoff.result == 'success' &&
         (needs.race-card-handoff.outputs.mode == 'full' || needs.race-card-handoff.outputs.mode == 'lines-only'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: github-pages
    env:
      CLOUD_INGEST_ENDPOINT: https://ypkmorovfnjyesfojcil.supabase.co/functions/v1/cloud-ingest
      CLOUD_INGEST_AUDIENCE: keirin-cloud-ingest-prod-v1
      COMMENT_ROOT: ${{ github.workspace }}/.comment-trial
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 予定実行枠から対象日を固定
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          MANUAL_TARGET_DATE: ${{ inputs.target_date || '' }}
          HANDOFF_TARGET_DATE: ${{ needs.race-card-handoff.outputs.target_date }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            target_date="$HANDOFF_TARGET_DATE"
          else
            target_date="$(python3 automation/cloud/cloud_target_date.py \
              --event-name "$EVENT_NAME" \
              --schedule "$EVENT_SCHEDULE" \
              --manual-date "$MANUAL_TARGET_DATE")"
          fi
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "comment target date: $target_date"

      - name: 完全なコメント世代の有無を確認
        id: comment_complete
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from automation.cloud.cloud_oidc_gateway_client import OIDCGatewayClient

          target = os.environ["TARGET_DATE"]
          client = OIDCGatewayClient(
              os.environ["CLOUD_INGEST_ENDPOINT"],
              os.environ["CLOUD_INGEST_AUDIENCE"],
              retries=1,
          )
          response = client.call({
              "operation": "read",
              "record_type": "cloud_comment_manifest",
              "record_key": target,
          })
          record = (response or {}).get("record") or {}
          payload = record.get("payload") or {}
          complete = (
              payload.get("dataset") == "cloud_comment_manifest"
              and payload.get("race_date") == target
              and payload.get("status") == "complete"
              and bool((payload.get("cloud_generation") or {}).get("generation_id"))
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"complete={'true' if complete else 'false'}\n")
          print(f"comment manifest already complete: {'true' if complete else 'false'}")
          PY

      - name: 対象日と保存済み出走表を確認
        if: steps.comment_complete.outputs.complete != 'true'
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          python3 -c 'import datetime, os; value=os.environ["TARGET_DATE"]; assert datetime.date.fromisoformat(value).isoformat() == value'
          test -f "data/$TARGET_DATE/manifest.json"
          mkdir -p "$COMMENT_ROOT/cache"

      - name: Restore meeting-resolution checkpoint
        id: restore-meetings
        if: steps.comment_complete.outputs.complete != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.comment-trial/meetings.json
          key: cloud-comment-meetings-${{ steps.target.outputs.target_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cloud-comment-meetings-${{ steps.target.outputs.target_date }}-

      - name: Build the saved-day comment catalog
        id: catalog
        if: steps.comment_complete.outputs.complete != 'true'
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          python3 automation/comments/cloud_comment_catalog.py "data/$TARGET_DATE" \
            --output "$COMMENT_ROOT/catalog.json"

      - name: Check one meeting candidate per venue
        id: meeting
        if: steps.comment_complete.outputs.complete != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.operation == 'acquire')
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 automation/comments/cloud_comment_meeting_resolver.py --live \
            --catalog "$COMMENT_ROOT/catalog.json" \
            --state "$COMMENT_ROOT/meetings.json" \
            --cache-root "$COMMENT_ROOT/cache" \
            --max-candidates-per-venue 6

      - name: Limit this trial to the 31 confirmed races
        id: selection
        if: steps.comment_complete.outputs.complete != 'true'
        env:
          COMMENT_OPERATION: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'acquire' || inputs.operation }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["COMMENT_ROOT"])
          catalog = json.loads((root / "catalog.json").read_text(encoding="utf-8"))
          selected = dict(catalog)
          if os.environ["COMMENT_OPERATION"] == "acquire-confirmed":
              state_path = root / "meetings.json"
              if not state_path.exists():
                  raise SystemExit("saved meeting checkpoint is missing")
              state = json.loads(state_path.read_text(encoding="utf-8"))
              meetings = state.get("meetings") or {}
              races = [
                  row for row in catalog.get("races") or []
                  if (meetings.get(str(row["race_id"])) or {}).get("evidence_status") == "confirmed"
              ]
              if len(races) != 31:
                  raise SystemExit(f"confirmed race count must be 31, got {len(races)}")
              selected["races"] = races
          (root / "catalog-selected.json").write_text(
              json.dumps(selected, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"selected={len(selected.get('races') or [])}")
          PY

      - name: Check whether every race has confirmed meeting evidence
        id: readiness
        if: steps.comment_complete.outputs.complete != 'true' && steps.selection.outcome == 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["COMMENT_ROOT"])
          catalog = json.loads((root / "catalog-selected.json").read_text(encoding="utf-8"))
          state_path = root / "meetings.json"
          state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
          meetings = state.get("meetings") or {}
          expected = {str(row["race_id"]) for row in catalog.get("races") or []}
          confirmed = {race_id for race_id, row in meetings.items() if row.get("evidence_status") == "confirmed"}
          missing = sorted(expected - confirmed)
          ready = not missing and bool(expected)
          print(f"ready={'true' if ready else 'false'}")
          print(f"expected={len(expected)} confirmed={len(expected - set(missing))} missing={len(missing)}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"ready={'true' if ready else 'false'}\n")
              handle.write(f"expected={len(expected)}\n")
              handle.write(f"missing={len(missing)}\n")
          PY

      - name: Save meeting-resolution checkpoint
        if: always() && steps.comment_complete.outputs.complete != 'true' && hashFiles(format('{0}/meetings.json', env.COMMENT_ROOT)) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.comment-trial/meetings.json
          key: cloud-comment-meetings-${{ steps.target.outputs.target_date }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Acquire inspection and post-race comments
        id: acquire
        if: steps.comment_complete.outputs.complete != 'true' && steps.readiness.outputs.ready == 'true'
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
          COMMENT_PAGE_CACHE: ${{ runner.temp }}/keirin-cloud-comments/cache
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          force_args=()
          if [ "$FORCE_REFRESH" = "true" ]; then
            force_args+=(--force)
          fi
          python3 automation/comments/cloud_comment_acquisition.py --live \
            --catalog "$COMMENT_ROOT/catalog-selected.json" \
            --meeting-evidence "$COMMENT_ROOT/meetings.json" \
            --state-db "$COMMENT_ROOT/state.sqlite3" \
            --output "$COMMENT_ROOT/records.json" \
            --run-report "$COMMENT_ROOT/acquisition-report.json" \
            --today "$TARGET_DATE" \
            "${force_args[@]}"

      - name: Save the independent comment generation through limited CAS
        id: publish
        if: steps.comment_complete.outputs.complete != 'true' && steps.acquire.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 automation/comments/cloud_comment_rpc_publish.py --live \
            --records "$COMMENT_ROOT/records.json" \
            --queue "$COMMENT_ROOT/queue.json" \
            --report "$COMMENT_ROOT/publish-report.json"

      - name: Verify the stored manifest and every dependency
        id: verify
        if: steps.comment_complete.outputs.complete != 'true' && steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["COMMENT_ROOT"])
          sys.path[:0] = ["automation/comments", "automation/cloud"]
          from cloud_comment_integration import validate_comment_generation
          from cloud_oidc_gateway_client import OIDCGatewayClient

          client = OIDCGatewayClient(os.environ["CLOUD_INGEST_ENDPOINT"], os.environ["CLOUD_INGEST_AUDIENCE"])
          target = os.environ["TARGET_DATE"]
          manifest_response = client.call({"operation": "read", "record_type": "cloud_comment_manifest", "record_key": target})
          manifest = (manifest_response or {}).get("record")
          if not manifest:
              raise SystemExit("comment manifest was not stored")
          race_ids = (manifest.get("payload") or {}).get("race_ids") or []
          records = []
          for race_id in race_ids:
              response = client.call({"operation": "read", "record_type": "cloud_race_comment", "record_key": race_id})
              record = (response or {}).get("record")
              if not record:
                  raise SystemExit(f"comment dependency missing: {race_id}")
              records.append(record)
          records.append(manifest)
          checked = validate_comment_generation(records)
          summary = {
              "target_date": target,
              "race_count": len(race_ids),
              "stored_records": len(records),
              "manifest_status": checked["status"],
              "state_counts": checked["state_counts"],
              "retry_required": checked["retry_required"],
          }
          (root / "verification.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=True, sort_keys=True))
          PY

      - name: Upload sanitized trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-comment-one-day-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/.comment-trial/acquisition-report.json
            ${{ github.workspace }}/.comment-trial/publish-report.json
            ${{ github.workspace }}/.comment-trial/verification.json
            ${{ github.workspace }}/.comment-trial/meetings.json
          if-no-files-found: warn
          retention-days: 14

      - name: Reflect comment trial failures in the job result
        if: always() && steps.comment_complete.outputs.complete != 'true' && (steps.readiness.outputs.ready != 'true' || steps.acquire.outcome == 'failure' || steps.publish.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: exit 1

