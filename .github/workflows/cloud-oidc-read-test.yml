name: Cloud manifest recovery 2026-10-29

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-manifest-recovery-20261029
  cancel-in-progress: false

jobs:
  publish-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: github-pages
    env:
      CLOUD_INGEST_ENDPOINT: https://ypkmorovfnjyesfojcil.supabase.co/functions/v1/cloud-ingest
      CLOUD_INGEST_AUDIENCE: keirin-cloud-ingest-prod-v1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish manifest from the saved complete generation
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/cloud/cloud_manifest_recover.py --target-date 2026-10-29 | tee "$RUNNER_TEMP/manifest-recovery.json"
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-manifest-recovery-20261029
          path: ${{ runner.temp }}/manifest-recovery.json
          if-no-files-found: warn
          retention-days: 14

