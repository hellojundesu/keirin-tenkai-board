name: WINTICKET開催ID・単発接続診断
on:
  push:
    paths:
      - .github/workflows/meeting-url-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 公開トップと開催ページのHTTP応答を比較
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re
          urls = [
            "https://www.winticket.jp/",
            "https://www.winticket.jp/keirin/tachikawa/racecard/2026111228/4/1",
          ]
          for url in urls:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 KeirinCommentCollector/1.0", "Accept-Language": "ja"})
              try:
                  response = urllib.request.urlopen(req, timeout=20)
              except urllib.error.HTTPError as exc:
                  response = exc
              except Exception as exc:
                  print(f"url={url} error={type(exc).__name__}: {exc}")
                  continue
              with response:
                  body = response.read(2048).decode("utf-8", errors="replace")
                  title = re.search(r"<title[^>]*>(.*?)</title>", body, re.I | re.S)
                  print(f"url={url} status={response.status} final_url={response.url}")
                  for key in ("server","content-type","via","x-cache","cf-ray","x-amz-cf-id","x-amzn-waf-action","retry-after"):
                      if response.headers.get(key):
                          print(f"  {key}: {response.headers.get(key)}")
                  print(f"  title={title.group(1).strip()[:150] if title else 'not_found'}")
          PY
