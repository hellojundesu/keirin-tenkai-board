name: 出走表を毎朝取得

on:
  push:
  schedule:
    - cron: '9 0 * * *' # full
    - cron: '0 9 * * *' # lines-only
  workflow_dispatch:
    inputs:
      mode:
        description: '取得内容（full=全項目、lines-only=空欄のラインだけ補完）'
        type: choice
        default: full
        options:
          - full
          - lines-only
      target_date:
        description: '再試行対象日（YYYY-MM-DD、空欄は実行予定日）'
        type: string
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: keirin-race-cards
  cancel-in-progress: false

jobs:
  fetch:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 予定された対象日を固定
        id: target
        if: github.event_name != 'push'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          target_date="$(python3 automation/cloud/cloud_target_date.py \
            --event-name "$EVENT_NAME" \
            --schedule "$EVENT_SCHEDULE" \
            --manual-date "$INPUT_TARGET_DATE")"
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "対象日を固定: $target_date"

      - name: ブラウザをインストール
        if: github.event_name != 'push'
        run: npm install --prefix automation

      - name: 対象日の出走表を取得
        id: scrape
        if: github.event_name != 'push'
        continue-on-error: true
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
          LINES_ONLY: ${{ github.event.schedule == '0 9 * * *' || inputs.mode == 'lines-only' }}
        run: |
          set -euo pipefail
          if [ "$LINES_ONLY" = "true" ]; then
            if [ ! -f "data/$TARGET_DATE/manifest.json" ]; then
              echo "対象日 $TARGET_DATE のmanifestがないためライン補完を保留します。"
              exit 75
            fi
            node automation/scrape.mjs --target-date "$TARGET_DATE" --lines-only
          else
            node automation/scrape.mjs --target-date "$TARGET_DATE"
          fi

      - name: 公開用データを更新
        if: github.event_name != 'push' && steps.scrape.outcome == 'success'
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from datetime import date, timedelta
          import os
          from pathlib import Path
          import shutil

          target = date.fromisoformat(os.environ["TARGET_DATE"])
          cutoff = target - timedelta(days=6)
          for folder in Path("data").iterdir():
              if not folder.is_dir() or folder.is_symlink():
                  continue
              try:
                  saved_date = date.fromisoformat(folder.name)
              except ValueError:
                  continue
              if folder.name != saved_date.isoformat():
                  continue
              if saved_date < cutoff:
                  shutil.rmtree(folder)
                  print(f"保存期限を過ぎたデータを削除: {folder.name}")
          PY
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "出走表を更新"
            git push
          fi

      - name: 既存のサイトと出走表を公開用にまとめる
        run: |
          mkdir -p public
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='automation/' --exclude='public/' --exclude='node_modules/' ./ public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: 公開サイトを更新
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 取得エラーを実行結果に表示
        if: always() && github.event_name != 'push' && steps.scrape.outcome == 'failure'
        run: exit 1
