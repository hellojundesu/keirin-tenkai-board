name: 出走表を毎朝取得

on:
  push:
  schedule:
    - cron: '9 0 * * *' # 09:09 JST. GitHub's scheduled start can be delayed.
    - cron: '0 9 * * *' # 18:00 JST: fill missing lines only.
  workflow_dispatch:
    inputs:
      mode:
        description: '取得内容（full=全項目、lines-only=空欄のラインだけ補完）'
        type: choice
        default: full
        options:
          - full
          - lines-only

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: keirin-race-cards
  cancel-in-progress: false

jobs:
  fetch:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ブラウザをインストール
        if: github.event_name != 'push'
        run: npm install --prefix automation
      - name: 当日の出走表を取得
        id: scrape
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          LINES_ONLY: ${{ github.event.schedule == '0 9 * * *' || inputs.mode == 'lines-only' }}
        run: |
          if [ "$LINES_ONLY" = "true" ]; then
            node automation/scrape.mjs --lines-only
          else
            node automation/scrape.mjs
          fi
      - name: 公開用データを更新
        if: github.event_name != 'push' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import shutil
          
          today = datetime.now(ZoneInfo("Asia/Tokyo")).date()
          cutoff = today - timedelta(days=6)
          for folder in Path("data").iterdir():
              if not folder.is_dir() or folder.is_symlink():
                  continue
              try:
                  saved_date = datetime.strptime(folder.name, "%Y-%m-%d").date()
              except ValueError:
                  continue
              if folder.name != saved_date.isoformat():
                  continue
              if saved_date < cutoff:
                  shutil.rmtree(folder)
                  print(f"保存期限を過ぎたデータを削除: {folder.name}")
          PY
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "出走表を更新"
            git push
          fi
      - name: 既存のサイトと出走表を公開用にまとめる
        run: |
          mkdir -p public
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='automation/' --exclude='public/' --exclude='node_modules/' ./ public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: 公開サイトを更新
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 取得エラーを実行結果に表示
        if: always() && steps.scrape.outcome == 'failure'
        run: exit 1
