name: 東スポ全コメURL発見検証
on:
  push:
    branches: [main]
    paths: ['automation/comments/tospo_discover_probe.py','.github/workflows/tospo-discovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 automation/comments/tospo_discover_probe.py
