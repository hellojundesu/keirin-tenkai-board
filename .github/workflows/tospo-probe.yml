name: 東スポコメント接続診断
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tospo-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: One public-page HTTP request (no authentication)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          url = "https://keirin.tokyo-sports.co.jp/list/with-comments"
          request = urllib.request.Request(url, headers={"User-Agent": "KeirinCommentCollector/1.0 (source availability diagnostic)"})
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = response.read(1000000).decode("utf-8", errors="replace")
                  print("HTTP_STATUS:", response.status)
                  print("COMMENT_SECTION_PRESENT:", "全コメレース" in body)
                  if response.status != 200 or "全コメレース" not in body:
                      raise SystemExit(1)
          except urllib.error.HTTPError as exc:
              print("HTTP_STATUS:", exc.code)
              raise SystemExit(1)
          except Exception as exc:
              print("NETWORK_ERROR:", type(exc).__name__, str(exc)[:150])
              raise SystemExit(1)
          PY
