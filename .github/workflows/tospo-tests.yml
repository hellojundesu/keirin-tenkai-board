name: 東スポコメント解析テスト
on:
  push:
    branches: [main]
    paths:
      - 'automation/comments/tospo_source.py'
      - 'automation/comments/test_tospo_source.py'
      - 'automation/comments/meeting_history.py'
      - 'automation/comments/test_meeting_history.py'
      - '.github/workflows/tospo-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline parser tests
        run: |
          python -m unittest discover -s automation/comments -p 'test_tospo_source.py' -v
          python -m unittest discover -s automation/comments -p 'test_meeting_history.py' -v
